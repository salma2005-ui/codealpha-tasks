<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #f0f0f0;
            font-family: Arial, sans-serif;
            margin: 0;
        }
        .calculator {
            background: #222;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .display input {
            width: 100%;
            height: 60px;
            font-size: 24px;
            text-align: right;
            margin-bottom: 10px;
            padding: 10px;
            border: none;
            border-radius: 5px;
            box-sizing: border-box;
            background: #fff;
            outline: none;
        }
        input[type="button"] {
            width: 60px;
            height: 60px;
            margin: 5px;
            font-size: 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background: #333;
            color: white;
            transition: 0.2s;
        }
        input[type="button"]:hover {
            background: #444;
        }
        /* تعديل تصميم زر اليساوي ليأخذ مساحة أكبر ويظهر باللون البرتقالي */
        input[value="="] {
            background: #ff9500;
            width: 130px;
        }
        input[value="="]:hover {
            background: #ffaa33;
        }
        input[value="AC"], input[value="DE"] {
            background: #ff3b30;
        }
        input[value="AC"]:hover, input[value="DE"]:hover {
            background: #ff5c52;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="calculator">
           <form name="calc">
            <div class="display">
                <input type="text" name="display" readonly>
            </div>
            
            <div>
                <input type="button" value="AC" onclick="calc.display.value=''">
                <input type="button" value="DE" onclick="calc.display.value=calc.display.value.toString().slice(0,-1)">
                <input type="button" value="." onclick="calc.display.value+='.'">
                <input type="button" value="/" onclick="calc.display.value+='/'">
            </div>

            <div>
                <input type="button" value="7" onclick="calc.display.value+='7'">
                <input type="button" value="8" onclick="calc.display.value+='8'">
                <input type="button" value="9" onclick="calc.display.value+='9'">
                <input type="button" value="*" onclick="calc.display.value+='*'">
            </div>
             
            <div>
                <input type="button" value="4" onclick="calc.display.value+='4'">
                <input type="button" value="5" onclick="calc.display.value+='5'">
                <input type="button" value="6" onclick="calc.display.value+='6'">
                <input type="button" value="-" onclick="calc.display.value+='-'">
            </div>

            <div>
                <input type="button" value="1" onclick="calc.display.value+='1'">
                <input type="button" value="2" onclick="calc.display.value+='2'">
                <input type="button" value="3" onclick="calc.display.value+='3'">
                <input type="button" value="+" onclick="calc.display.value+='+'">
            </div>

            <div>
                <input type="button" value="0" onclick="calc.display.value+='0'">
                <input type="button" value="00" onclick="calc.display.value+='00'">
                <input type="button" value="=" onclick="try{calc.display.value=eval(calc.display.value)}catch{calc.display.value='Error'}">
            </div>
        </form>
        </div>
    </div>
</body>
</html>
